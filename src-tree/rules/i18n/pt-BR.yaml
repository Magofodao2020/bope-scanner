# Texto das regras em português do Brasil, por id. O que faltar volta para o inglês do rule.yaml.

d5e16389-ebfc-4885-adf7-f24e6bcd7b0c:
  title: "RobloxPlayerBeta.exe sem assinatura embutida verificável aqui"
  description: >-
    O player do Roblox em uma pasta de versão não tem assinatura Authenticode embutida, tem uma que
    não confere, ou uma que o Windows não conseguiu verificar sem internet; a linha diz qual. O
    player oficial é assinado pela Roblox Corporation. Isso não diz que o arquivo foi alterado, o
    que ele faz, nem que foi executado.
  retention: >-
    O arquivo como está no momento da verificação. Uma atualização do Roblox substitui a pasta de
    versão.
  falsepositives:
    - "Um PC cujo repositório de certificados não tem o certificado raiz, que o Windows normalmente baixa da internet na primeira vez; esta verificação nunca acessa a internet"
    - "Arquivo do player danificado por atualização interrompida, problema de disco ou antivírus que o colocou parcialmente em quarentena"

9888b00d-53c9-47ff-b719-2ed7c44b8fe1:
  title: "Arquivo com nome de DLL do sistema ao lado do player do Roblox"
  description: >-
    Uma DLL com nome de biblioteca do Windows (version.dll, dxgi.dll, winmm.dll e similares) está
    diretamente numa pasta de versão do Roblox. O Windows procura primeiro na pasta do próprio
    programa, então um arquivo ali com esse nome é carregado no lugar da biblioteca real: a técnica
    de "proxy DLL". O player oficial não traz esses arquivos. Isso não diz o que a DLL faz nem que o
    player a carregou.
  retention: >-
    A pasta de versão como está no momento da verificação.
  falsepositives:
    - "Ferramentas de pós-processamento gráfico como ReShade, que se instalam como dxgi.dll ou d3d11.dll ao lado do jogo"
    - "Arquivo copiado ali manualmente ao tentar resolver um travamento"

1a665dfa-9a53-4dcb-a9ec-942ac07d57e6:
  title: "Programa ou DLL sem assinatura ao lado do player do Roblox"
  description: >-
    Um arquivo .dll, .exe ou .asi diretamente numa pasta de versão do Roblox não tem assinatura
    embutida, ou tem uma que não confere. O Roblox assina os binários que distribui; um arquivo sem
    assinatura ali provavelmente foi colocado por outra coisa. Não diz o que o arquivo faz nem que
    foi carregado.
  retention: >-
    A pasta de versão como está no momento da verificação.
  falsepositives:
    - "Binário do Roblox assinado via catálogo do Windows em vez de assinatura embutida (não observado no Roblox)"
    - "Ferramentas gráficas ou de overlay que colocam uma DLL na pasta do jogo"

50882b33-a1aa-4e8c-bf59-7f4175c9b00f:
  title: "Configurações do cliente Roblox (FastFlags) alteradas"
  description: >-
    Um arquivo ClientAppSettings.json numa pasta de versão do Roblox define uma ou mais
    configurações do motor ("FastFlags"). Bootstrappers como o Bloxstrap escrevem esse arquivo para
    mudar gráficos, FPS e iluminação, e o Roblox só aceita uma lista permitida de flags. Só a
    quantidade é lida, nunca as flags ou valores.
  retention: >-
    O arquivo como está no momento da verificação.
  falsepositives:
    - "Bloxstrap, Fishstrap e launchers semelhantes, cujas telas de configuração escrevem esse arquivo"
    - "Guias de desbloqueio de FPS que mandam criar o arquivo manualmente"

e315d48a-2cf4-4e84-8a0b-4fd9ccfac04e:
  title: "Bootstrapper de terceiros do Roblox instalado"
  description: >-
    Bloxstrap, Fishstrap ou Voidstrap tem uma pasta em %LOCALAPPDATA%. São launchers de código
    aberto que instalam e iniciam o player oficial do Roblox com configurações extras; não são
    cheats. Mostrado como contexto.
  retention: >-
    A pasta como está no momento da verificação.
  falsepositives:
    - "Qualquer jogador que prefira esses launchers pelas configurações, presença no Discord ou desbloqueio de FPS"

d01b990f-c1bd-45db-810a-41a2e057aab8:
  title: "Player do Roblox em execução com módulo carregado de pasta do usuário"
  description: >-
    Uma DLL carregada no player do Roblox em execução vem de Temp, Downloads, Área de Trabalho,
    Documentos, AppData\Roaming, perfil Público, Lixeira ou outro lugar do perfil — pastas onde
    qualquer programa pode escrever. Overlays e drivers normalmente carregam de Program Files,
    AppData\Local ou Windows. Mostra que o módulo estava carregado no momento; não diz o que ele
    faz. Os módulos só podem ser listados quando o anticheat do Roblox permite; caso contrário a
    linha fica como não verificada.
  retention: >-
    Os módulos carregados no momento da verificação. Um módulo descarregado antes não aparece.
  falsepositives:
    - "Overlay, gravador ou ferramenta de entrada instalada por usuário fora de AppData\\Local"
    - "Extensão de shell ou ferramenta de acessibilidade carregada em todo processo a partir de pasta do usuário"

4a3bec67-abe3-4fb4-88f0-13f365ee2d8d:
  title: "Player do Roblox com módulo sem assinatura de fora da sua pasta"
  description: >-
    Uma DLL carregada no player do Roblox, fora do Windows e fora da pasta de versão do player, não
    tem assinatura embutida ou tem uma que não confere. A maioria dos overlays, capturadores e
    drivers que entram em jogos é assinada. Não diz o que o módulo faz.
  retention: >-
    Os módulos carregados no momento da verificação.
  falsepositives:
    - "Overlays pequenos ou de código aberto, contadores de FPS e ferramentas de entrada sem assinatura"
    - "Módulo assinado via catálogo do Windows, que esta verificação não lê"

da5a1b8d-6278-432a-9172-81b365f22e1b:
  title: "Player do Roblox com memória executável privada"
  description: >-
    Uma varredura do espaço de endereços do player encontrou memória privada executável. Código
    mapeado manualmente e shellcode têm essa aparência — e também o próprio anticheat do Roblox, que
    aloca e decifra código em tempo de execução, além de compiladores JIT e muitos overlays.
    Mostrado só como contexto, nunca como achado sozinho. Nenhum conteúdo de memória é lido.
  retention: >-
    O espaço de endereços no momento da verificação.
  falsepositives:
    - "O anticheat do Roblox (Hyperion), que produz exatamente isso"
    - "Overlays e capturadores que colocam trampolins de hook em processos de jogo"

719dca43-ca1f-4a18-b9c2-d5bd2a13b6a0:
  title: "Programa sem assinatura em execução a partir de Temp, Downloads, Área de Trabalho ou Lixeira"
  description: >-
    Um processo em execução foi iniciado de Temp, Downloads, Área de Trabalho, perfil Público ou
    Lixeira, e o arquivo não tem assinatura embutida ou tem uma que não confere. Loaders e injetores
    costumam ser executados assim; ferramentas portáteis e instaladores recém-baixados também.
  retention: >-
    Processos em execução no momento da verificação.
  falsepositives:
    - "Ferramentas portáteis, mods e utilitários executados direto de Downloads ou da Área de Trabalho"
    - "Um instalador ainda rodando a partir de Downloads"

37172247-176e-4b49-a26c-b2781ba64696:
  title: "Pasta organizada como um executor de scripts do Roblox"
  description: >-
    Uma pasta em Área de Trabalho, Downloads, Documentos, AppData ou Temp tem as subpastas
    "autoexec" e "workspace" — a estrutura que executores de script do Roblox criam ao lado de si
    para scripts executados automaticamente e arquivos escritos por scripts. Mostra que a pasta
    existe, não que o executor foi executado.
  retention: >-
    As pastas como estão no momento da verificação, até dois níveis abaixo de cada local examinado.
  falsepositives:
    - "Executor baixado e nunca aberto, ou guardado para estudo"
    - "Desenvolvedores de script hubs e pesquisadores de anticheat que mantêm essas pastas de propósito"

865aa527-ba58-46bf-8c5e-305f15cecf99:
  title: "Script em autoexec chama funções que só existem em executores"
  description: >-
    Um script numa pasta autoexec de executor chama duas ou mais funções que só existem em
    executores de script do Roblox (getgenv, hookfunction, getrawmetatable, fireclickdetector,
    game:HttpGet e similares). Código normal de jogo Roblox não consegue chamá-las. Só se guarda
    quais funções aparecem, nunca o script. Não mostra que o script foi executado.
  retention: >-
    Os scripts como estão no momento da verificação.
  falsepositives:
    - "Scripts baixados e guardados sem uso"
    - "Desenvolvedores e pesquisadores de anticheat que guardam scripts de exploit como amostra"

1182fdb3-a9bc-40d7-b42c-793498ea2a49:
  title: "Programa ou DLL sem assinatura numa pasta de executor"
  description: >-
    Um .exe ou .dll diretamente numa pasta organizada como executor de scripts do Roblox não tem
    assinatura embutida verificável aqui. O hash é mostrado para comparação com arquivos conhecidos.
  retention: >-
    A pasta como está no momento da verificação.
  falsepositives:
    - "Ferramentas sem assinatura guardadas numa pasta que por acaso tem essas subpastas"

b127ba49-3637-47b3-b5c7-614b6a57a29a:
  title: "Pasta com nome de executor de Roblox conhecido publicamente"
  description: >-
    Uma pasta num dos locais examinados tem exatamente o nome de um executor de scripts do Roblox
    discutido publicamente (Solara, Xeno, Celery, KRNL, Fluxus e outros). Vários desses nomes são
    palavras comuns e um nome de pasta é o que alguém digitou, então isto é só contexto: veja o que
    a pasta contém.
  retention: >-
    As pastas como estão no momento da verificação.
  falsepositives:
    - "Pasta com o mesmo nome por motivo não relacionado: save de jogo, projeto, pasta de músicas"

0c4c4fb6-5563-4bb7-89dc-42c73ca13347:
  title: "Script Lua em Downloads, Área de Trabalho ou Documentos chama funções exclusivas de executor"
  description: >-
    Um arquivo .lua ou .luau em Downloads, Área de Trabalho ou Documentos chama duas ou mais funções
    que só existem em executores de script do Roblox. Código normal de jogo e projetos do Roblox
    Studio não conseguem chamá-las. Só se guarda quais funções aparecem. Não mostra que o script foi
    executado.
  retention: >-
    Os arquivos como estão no momento da verificação, até um nível abaixo de cada pasta.
  falsepositives:
    - "Scripts baixados e nunca usados"
    - "Amostras guardadas por pesquisadores de anticheat"

1488df5e-64af-4447-94c8-b13c81bb217f:
  title: "Script Lua baixa e executa outro script com game:HttpGet"
  description: >-
    Um arquivo .lua ou .luau contém loadstring(game:HttpGet(...)) numa linha — o formato que loaders
    de executor usam para baixar e rodar um script remoto. game:HttpGet não é API do Roblox; só
    executores o fornecem.
  retention: >-
    Os arquivos como estão no momento da verificação.
  falsepositives:
    - "Script loader salvo de fórum ou vídeo e nunca executado"

f8eb887a-cd84-4fdb-87fa-cd6bf548a847:
  title: "Programa sem assinatura baixado da internet numa pasta do usuário"
  description: >-
    Um programa ou DLL em Downloads, Área de Trabalho ou Documentos tem a Marca da Web do Windows
    (zona Internet) e não tem assinatura embutida verificável. Mostrado com o hash e, se o jogador
    concordou, o host de origem. Muitos downloads comuns não têm assinatura.
  retention: >-
    Os arquivos como estão no momento da verificação.
  falsepositives:
    - "Mods, jogos independentes, ferramentas de código aberto e utilitários, muitas vezes sem assinatura"

ca5715c2-c906-451c-a8ac-e13279418d3c:
  title: "Script de macro em Downloads, Área de Trabalho ou Documentos"
  description: >-
    Um arquivo do AutoHotkey (.ahk, .ah2), AutoIt (.au3) ou macro gravada (.rec, .mcr) está em
    Downloads, Área de Trabalho ou Documentos. Essas ferramentas automatizam teclado e mouse. Só o
    nome e os horários são lidos, nunca o arquivo.
  retention: >-
    Os arquivos como estão no momento da verificação.
  falsepositives:
    - "Atalhos de produtividade, correções de layout de teclado e scripts de acessibilidade, o uso mais comum do AutoHotkey"

1569d65c-db37-4f1f-a668-e2e459315d98:
  title: "Programa em Temp ou na Lixeira: o Explorer contou uma execução"
  description: >-
    Para um arquivo numa pasta Temp ou na Lixeira, o Explorer contou uma execução. Programas
    raramente rodam da Lixeira, e loaders costumam se descompactar em Temp antes de rodar;
    instaladores e atualizadores também rodam de Temp. Contexto para a linha do tempo, nunca um
    achado sozinho.
  retention: >-
    Entradas desde a criação da conta ou desde que um limpador as removeu; nada é escrito com
    "Rastrear inicializações de apps" desligado.
  falsepositives:
    - "Instaladores, atualizadores e arquivos autoextraíveis, que se descompactam em Temp e rodam de lá"

71839ff2-255a-4df3-8014-de800fd4ffa1:
  title: "Programa em Temp ou na Lixeira: o mecanismo de compatibilidade registrou o arquivo (não prova execução)"
  description: >-
    Para um arquivo numa pasta Temp ou na Lixeira, o mecanismo de compatibilidade registrou o
    arquivo (não prova execução). Programas raramente rodam da Lixeira, e loaders costumam se
    descompactar em Temp antes de rodar; instaladores e atualizadores também rodam de Temp. Contexto
    para a linha do tempo, nunca um achado sozinho.
  retention: >-
    Até 1 024 entradas, gravadas no desligamento; arquivos vistos desde a última reinicialização
    geralmente faltam.
  falsepositives:
    - "Instaladores, atualizadores e arquivos autoextraíveis, que se descompactam em Temp e rodam de lá"

600821fa-4ec6-44b1-bb39-a324585c169f:
  title: "Horários de programa cujo nome começa como o de um executor público de Roblox"
  description: >-
    Coloca na linha do tempo os horários que esta fonte registra para um programa cujo nome de
    arquivo começa com o nome de um executor de Roblox discutido publicamente. Nome de arquivo não é
    identidade: qualquer um pode dar qualquer nome a um arquivo.
  retention: >-
    O que esta fonte ainda guarda.
  falsepositives:
    - "Arquivo renomeado ou nomeado assim por motivo não relacionado; um nome não identifica um programa, e um horário ausente não é evidência de nada"

751f3ec7-4cff-4cd7-81f1-5a71150b3681:
  title: "Horários de programa cujo nome começa como o de um executor público de Roblox"
  description: >-
    Coloca na linha do tempo os horários que esta fonte registra para um programa cujo nome de
    arquivo começa com o nome de um executor de Roblox discutido publicamente. Nome de arquivo não é
    identidade: qualquer um pode dar qualquer nome a um arquivo.
  retention: >-
    O que esta fonte ainda guarda.
  falsepositives:
    - "Arquivo renomeado ou nomeado assim por motivo não relacionado; um nome não identifica um programa, e um horário ausente não é evidência de nada"

a6944ed9-500f-40b4-aadb-3d53a3825552:
  title: "Horários de programa cujo nome começa como o de um executor público de Roblox"
  description: >-
    Coloca na linha do tempo os horários que esta fonte registra para um programa cujo nome de
    arquivo começa com o nome de um executor de Roblox discutido publicamente. Nome de arquivo não é
    identidade: qualquer um pode dar qualquer nome a um arquivo.
  retention: >-
    O que esta fonte ainda guarda.
  falsepositives:
    - "Arquivo renomeado ou nomeado assim por motivo não relacionado; um nome não identifica um programa, e um horário ausente não é evidência de nada"

a10c08a6-2f00-40e2-838b-a874db8f7722:
  title: "Programa aberto pelo Explorer se descreve como injetor, executor ou exploit"
  description: >-
    O nome de produto que o Explorer guardou do recurso de versão de um programa contém "Injector",
    "Executor" ou "Exploit". Esse nome vem do próprio arquivo, então um arquivo renomeado o mantém;
    também é o que o autor escolheu. Palavra genérica é contexto, nunca prova.
  retention: >-
    Entradas desde a criação da conta ou desde que um limpador as removeu; nenhum horário é
    guardado.
  falsepositives:
    - "Injetores legítimos usados para mods de jogos single-player, depuração ou acessibilidade"
    - "Ferramentas de teste de segurança cujos nomes usam essas palavras"

32d96608-ac3e-4571-ac9b-2f11763e6fdc:
  title: "Windows configurado para iniciar outro programa no lugar do Roblox"
  description: >-
    Existe um valor "Debugger" em Image File Execution Options para um executável do Roblox, então o
    Windows inicia o programa indicado no lugar dele, repassando a linha de comando do Roblox.
    Depuradores usam isso; também programas que querem rodar antes ou em volta de um jogo. Só o
    programa é mostrado, nunca os argumentos.
  retention: >-
    A configuração como está no momento da verificação.
  falsepositives:
    - "Desenvolvedor depurando o cliente do Roblox com um depurador configurado assim"

e2c3db41-ea07-4a4d-a416-7202b2d01cae:
  title: "Programa em pasta do usuário configurado para iniciar no lugar de, ou depois de, outro programa"
  description: >-
    Um "Debugger" de Image File Execution Options ou um "MonitorProcess" de SilentProcessExit aponta
    para um programa numa pasta onde qualquer usuário escreve. O Windows então o inicia no lugar do
    alvo, ou quando o alvo roda. Malware usa isso para persistência; algumas ferramentas
    configuradas pela pessoa também.
  retention: >-
    A configuração como está no momento da verificação.
  falsepositives:
    - "Process Explorer ou outro substituto do Gerenciador de Tarefas guardado numa pasta do usuário"
    - "Ferramentas de depuração configuradas por um desenvolvedor"

84c8f9d7-14cb-4481-9c31-5d37a11720eb:
  title: "Depurador configurado em Image File Execution Options"
  description: >-
    O Windows está configurado para iniciar outro programa no lugar do indicado na linha. Mostrado
    como contexto; o caso mais comum é o Process Explorer substituindo o Gerenciador de Tarefas.
  retention: >-
    A configuração como está no momento da verificação.
  falsepositives:
    - "Opção \"Replace Task Manager\" do Process Explorer"
    - "Depuradores configurados por desenvolvedores"

939e1a62-9d1f-4b25-99a7-289b62e16320:
  title: "AppInit_DLLs configurado e ativado"
  description: >-
    O Windows está configurado para carregar a DLL listada em todo processo que carrega user32.dll —
    quase todo programa com janela. A Microsoft desaconselha esse mecanismo, e ele fica desativado
    com Secure Boot ligado; a linha mostra se está ativado e qual DLL indica.
  retention: >-
    A configuração como está no momento da verificação.
  falsepositives:
    - "Ferramentas antigas de acessibilidade, método de entrada ou vídeo que ainda usam esse mecanismo"

0e329d8d-b915-45ac-8cfb-d2daef40f901:
  title: "Winlogon inicia algo diferente do shell ou Userinit do Windows"
  description: >-
    O valor Shell ou Userinit do Winlogon aponta para um programa que não é o explorer.exe ou
    userinit.exe do Windows, então ele inicia a cada logon. Só o programa é mostrado.
  retention: >-
    A configuração como está no momento da verificação.
  falsepositives:
    - "Software de quiosque ou substituto de shell configurado de propósito"
    - "Algumas ferramentas de controle parental e gerenciamento"

3322da9a-b8ad-4462-8d9e-7acb55a97f5e:
  title: "DLL configurada para carregar via AppCertDlls ou Application Verifier"
  description: >-
    O Windows está configurado para carregar a DLL indicada em processos que criam outros processos
    (AppCertDlls), ou no programa-alvo via Application Verifier. Ambos são raros fora de
    desenvolvimento e testes.
  retention: >-
    A configuração como está no momento da verificação.
  falsepositives:
    - "Sessões do Application Verifier deixadas configuradas por desenvolvedor"
    - "Alguns produtos de segurança"

bb11792b-bbdd-48c6-ba23-667a118b4308:
  title: "Ferramenta de edição de memória ou inspeção de processos instalada"
  description: >-
    A lista de programas instalados do Windows tem um cujo nome o coloca no grupo "memory_tool". A
    linha mostra nome, editor, versão e data de instalação. Estar instalado diz o que o software
    pode fazer, não para que foi usado; uma cópia desinstalada ou portátil não deixa entrada aqui.
  retention: >-
    Programas cuja entrada de desinstalação ainda está no registro no momento da verificação.
  falsepositives:
    - "Mods de jogos single-player, desenvolvimento de jogos e estudo de engenharia reversa"
    - "Administradores de sistema e desenvolvedores que usam Process Hacker ou System Informer"

926dfea8-5be5-417c-b5f3-6feb2a6f0761:
  title: "Ferramenta de macro ou auto-clicker instalada"
  description: >-
    A lista de programas instalados do Windows tem um cujo nome o coloca no grupo "macro_tool". A
    linha mostra nome, editor, versão e data de instalação. Estar instalado diz o que o software
    pode fazer, não para que foi usado; uma cópia desinstalada ou portátil não deixa entrada aqui.
  retention: >-
    Programas cuja entrada de desinstalação ainda está no registro no momento da verificação.
  falsepositives:
    - "Automação de produtividade e acessibilidade, o uso comum do AutoHotkey e AutoIt"

77316dfc-9588-441f-8c89-0c0ceeddb73c:
  title: "Software de mouse ou teclado que pode guardar macros instalado"
  description: >-
    A lista de programas instalados do Windows tem um cujo nome o coloca no grupo
    "peripheral_suite". A linha mostra nome, editor, versão e data de instalação. Estar instalado
    diz o que o software pode fazer, não para que foi usado; uma cópia desinstalada ou portátil não
    deixa entrada aqui.
  retention: >-
    Programas cuja entrada de desinstalação ainda está no registro no momento da verificação.
  falsepositives:
    - "Qualquer pessoa que tenha mouse ou teclado da marca; macros são um recurso entre iluminação e DPI"

62242277-a132-48b2-b457-83c1b433c61c:
  title: "Limpador capaz de apagar rastros de uso instalado"
  description: >-
    A lista de programas instalados do Windows tem um cujo nome o coloca no grupo "trace_cleaner". A
    linha mostra nome, editor, versão e data de instalação. Estar instalado diz o que o software
    pode fazer, não para que foi usado; uma cópia desinstalada ou portátil não deixa entrada aqui.
  retention: >-
    Programas cuja entrada de desinstalação ainda está no registro no momento da verificação.
  falsepositives:
    - "Limpeza de disco comum e higiene de privacidade"

edd66aa7-ee7e-4c79-89b3-201ccda5c4b1:
  title: "Software de VPN ou proxy instalado"
  description: >-
    A lista de programas instalados do Windows tem um cujo nome o coloca no grupo "vpn_proxy". A
    linha mostra nome, editor, versão e data de instalação. Estar instalado diz o que o software
    pode fazer, não para que foi usado; uma cópia desinstalada ou portátil não deixa entrada aqui.
  retention: >-
    Programas cuja entrada de desinstalação ainda está no registro no momento da verificação.
  falsepositives:
    - "Privacidade, VPN de trabalho, redes escolares e jogar em servidores de outras regiões"

4ac0ac60-f04d-4da3-8c8c-3ede5dc4157d:
  title: "Software de máquina virtual ou emulador Android instalado"
  description: >-
    A lista de programas instalados do Windows tem um cujo nome o coloca no grupo "virtual_machine".
    A linha mostra nome, editor, versão e data de instalação. Estar instalado diz o que o software
    pode fazer, não para que foi usado; uma cópia desinstalada ou portátil não deixa entrada aqui.
  retention: >-
    Programas cuja entrada de desinstalação ainda está no registro no momento da verificação.
  falsepositives:
    - "Desenvolvimento, testes, trabalhos escolares e jogos mobile"

d2436b4d-95ef-4cd7-b71b-18613bdd4a76:
  title: "Interpretador de macro em execução durante a verificação"
  description: >-
    AutoHotkey, AutoIt ou TinyTask está em execução, com seu nome de arquivo usual. Eles rodam
    scripts que enviam entrada de teclado e mouse. Uma cópia renomeada não é vista pelo nome, e um
    script comum de atalhos usa o mesmo interpretador.
  retention: >-
    Processos em execução no momento da verificação.
  falsepositives:
    - "Atalhos de produtividade, expansão de texto e scripts de acessibilidade rodando em segundo plano"

003a01bc-baff-4536-bee2-034a19a3eee4:
  title: "Editor de memória, depurador ou inspetor de processos em execução durante a verificação"
  description: >-
    Cheat Engine, Process Hacker, System Informer ou x64dbg está em execução com seu nome de arquivo
    usual. Eles podem ler e alterar a memória de outros programas. Uma cópia renomeada não é vista
    pelo nome.
  retention: >-
    Processos em execução no momento da verificação.
  falsepositives:
    - "Desenvolvedores e modders usando essas ferramentas para outro trabalho"
    - "System Informer aberto para acompanhar o sistema"

6c338af4-c3b9-4cc9-aa2c-b0204af85495:
  title: "Runtime de script em execução durante a verificação"
  description: >-
    Node.js, Python, Deno, Bun ou Windows Script Host está em execução. Scripts de automação rodam
    neles, assim como servidores de desenvolvimento, bots de Discord e muitas ferramentas. Linhas de
    comando não são lidas.
  retention: >-
    Processos em execução no momento da verificação.
  falsepositives:
    - "Trabalho de desenvolvimento, bots, servidores locais e ferramentas feitas nesses runtimes"

3daec665-7482-4667-a268-3be496783a83:
  title: "Placa microcontroladora já atuou como teclado ou mouse neste PC"
  description: >-
    A lista de dispositivos do Windows tem um teclado, mouse ou outro dispositivo de entrada cujo
    vendor id pertence a um fabricante de placas microcontroladoras (Arduino, SparkFun, Adafruit,
    Raspberry Pi, o id compartilhado do Teensy e outros), conectado agora ou lembrado. Dispositivos
    de automação de entrada e "Bad USB" são feitos com essas placas. A linha mostra se está
    conectado e os horários de instalação, chegada e remoção. O Windows não registra o que um
    teclado digitou, e uma placa pode alegar qualquer vendor id.
  retention: >-
    Dispositivos que o Windows ainda lembra; um removido com ferramenta de limpeza ou antes de
    reinstalação não aparece.
  falsepositives:
    - "Teclados mecânicos montados à mão, macro pads e painéis de simulador de voo, comumente feitos com Arduino Pro Micro ou RP2040"
    - "Projetos de eletrônica que atuam como teclado ou controle"

e4ae1194-c460-4e8a-81e3-112e94381f23:
  title: "Placa microcontroladora ou adaptador USB-serial já conectado"
  description: >-
    O Windows lembra um dispositivo USB cujo vendor id pertence a um fabricante de placas
    microcontroladoras ou dos chips USB-serial usados em placas clone. Contexto para a linha de
    dispositivo de entrada; sozinho, é um projeto de eletrônica, uma impressora 3D ou um cabo de
    gravação.
  retention: >-
    Dispositivos que o Windows ainda lembra.
  falsepositives:
    - "Impressoras 3D, cabos de gravação, eletrônica amadora e programação de microcontroladores"

1d8680d3-8cf6-455b-82ef-f905009e6d47:
  title: "Extensão de navegador pode rodar scripts do usuário"
  description: >-
    Uma extensão tem a permissão userScripts (Tampermonkey, Violentmonkey e similares), então pode
    rodar JavaScript que o usuário instala nas páginas. Os scripts não são lidos.
  retention: >-
    Extensões instaladas em cada perfil de navegador no momento da verificação.
  falsepositives:
    - "Userscripts para ajustes de sites, temas escuros e acessibilidade, o uso comum desses gerenciadores"

023f1d59-2377-4212-bb42-d293d1e5de44:
  title: "Extensão de navegador pode ler ou alterar o site do Roblox"
  description: >-
    As permissões de host ou content scripts de uma extensão citam roblox.com. Muitas extensões do
    site do Roblox (temas, ajuda de trocas, busca de servidores) precisam disso; diz respeito ao
    site, não ao cliente do jogo.
  retention: >-
    Extensões instaladas em cada perfil de navegador no momento da verificação.
  falsepositives:
    - "Extensões de personalização, trocas e busca de servidores do site do Roblox"

b125fe47-1ce6-4239-bad4-b4d67b98ebde:
  title: "Extensão com controle do DevTools pode alcançar o site do Roblox"
  description: >-
    Uma extensão tem a permissão debugger, que permite controlar páginas pelo protocolo do DevTools,
    e alcança roblox.com. Essa combinação pode alterar o comportamento do site muito além de um
    content script.
  retention: >-
    Extensões instaladas em cada perfil de navegador no momento da verificação.
  falsepositives:
    - "Extensões de desenvolvimento web, testes automatizados e acessibilidade que precisam do DevTools"

4e0c9a27-0922-4831-84da-0c2bebf93ea6:
  title: "Driver de rede VPN ou túnel instalado"
  description: >-
    Um adaptador de rede cuja descrição de driver cita túnel ou VPN (TAP, TUN, Wintun, WireGuard,
    OpenVPN, ZeroTier, Hamachi, Radmin) está instalado. Instalado não é conectado: o Windows mantém
    a entrada mesmo após remover o software.
  retention: >-
    A configuração no momento da verificação.
  falsepositives:
    - "VPNs de trabalho e escola, VPNs de privacidade, proxies de desenvolvimento, máquinas virtuais e ferramentas de jogo em LAN"

01293bed-96b3-4de6-b12c-a0ffb28a4603:
  title: "Proxy WinHTTP configurado para a máquina toda"
  description: >-
    O netsh winhttp guardou um proxy, usado por serviços do Windows e alguns programas. O endereço
    do proxy não é lido.
  retention: >-
    A configuração no momento da verificação.
  falsepositives:
    - "VPNs de trabalho e escola, VPNs de privacidade, proxies de desenvolvimento, máquinas virtuais e ferramentas de jogo em LAN"

3709cca0-3371-49e6-b687-9eb46b21977e:
  title: "Variável de ambiente de proxy definida"
  description: >-
    HTTP_PROXY, HTTPS_PROXY, ALL_PROXY ou NO_PROXY está definida para esta conta. Ferramentas de
    linha de comando e runtimes de script seguem essas variáveis. O valor não é lido.
  retention: >-
    A configuração no momento da verificação.
  falsepositives:
    - "VPNs de trabalho e escola, VPNs de privacidade, proxies de desenvolvimento, máquinas virtuais e ferramentas de jogo em LAN"

4a370a6f-4027-45ed-9704-8bbd1355e41f:
  title: "Este Windows parece rodar dentro de uma máquina virtual"
  description: >-
    As strings de firmware citam um fabricante de hipervisor (VMware, VirtualBox, QEMU, Xen,
    Parallels, "Virtual Machine" do Hyper-V), ou drivers de convidado de VM estão registrados. Uma
    verificação dentro de VM examina essa VM, não o PC em que o jogador pode estar jogando. Strings
    SMBIOS podem ser alteradas, então um PC físico também pode ocultar ou falsificar isso.
  retention: >-
    As strings de firmware que o Windows leu na última inicialização.
  falsepositives:
    - "Jogadores que usam Windows em VM por outros motivos, ou PCs de cloud gaming"

d5f36166-0023-4b99-9334-333938feca9e:
  title: "Windows iniciou por BIOS legado, não UEFI"
  description: >-
    O Windows informa que iniciou por BIOS legado (ou módulo de compatibilidade UEFI). O Secure Boot
    exige UEFI, então não pode estar ativo. É uma configuração, não evidência de cheat.
  retention: >-
    Como o Windows iniciou desta vez.
  falsepositives:
    - "PCs antigos e instalações feitas antes de mudar o firmware para UEFI"

dbdc66d4-53ee-46cc-9f9f-ff13f5632917:
  title: "Log de Segurança registra alteração do horário do sistema"
  description: >-
    O log de Segurança contém o evento 4616, "O horário do sistema foi alterado", com a quantidade e
    a primeira e última ocorrência. A sincronização de horário do próprio Windows também o escreve,
    e esta ferramenta não lê quem fez a alteração, então é contexto para interpretar os outros
    horários do relatório.
  retention: >-
    Só o que o log de Segurança ainda guarda; ele mantém uma janela limitada.
  falsepositives:
    - "Sincronização do serviço de Horário do Windows, horário de verão e reset da bateria CMOS"

3788a085-39d3-40ec-95e8-55a95df0868c:
  title: "Log do Sistema registra instalação de serviço ou driver"
  description: >-
    O log do Sistema contém o evento 7045, "Um serviço foi instalado no sistema", com quantidade e
    primeira e última ocorrência. Drivers de kernel são instalados do mesmo jeito, então isto coloca
    instalações de drivers e serviços na linha do tempo. Qual serviço não é lido.
  retention: >-
    Só o que o log do Sistema ainda guarda.
  falsepositives:
    - "Toda atualização de driver, anticheat de jogos, antivírus e muitos instaladores comuns"

e7a540ea-3155-4cac-acc0-195890b35302:
  title: "Plug and Play registrou dispositivos sendo configurados ou iniciados"
  description: >-
    O log de configuração Kernel-PnP contém eventos 400 ou 410, escritos quando um dispositivo é
    configurado ou iniciado, com primeira e última ocorrência. Mostrado junto aos horários de USB
    para entender quando dispositivos foram conectados.
  retention: >-
    Só o que o log Kernel-PnP ainda guarda.
  falsepositives:
    - "Todo dispositivo USB conectado e toda inicialização do Windows"

73592699-8fc5-468d-a22d-17ccb6898b15:
  title: "Ferramenta de executor/injetor do Roblox corroborada por fontes independentes"
  description: >-
    A correlação de todas as fontes lidas encontrou um executor de scripts ou injetor de DLL do
    Roblox, pelo nome em contexto Roblox, em duas ou mais famílias de fontes independentes, com ao
    menos uma mostrando execução (Prefetch, BAM, PCA, UserAssist, FeatureUsage, processo em
    execução), estrutura de pasta de executor, scripts exclusivos de executor ou módulo no player do
    Roblox. A linha mostra as famílias, as classes de evidência e os horários. Nomes podem ser
    copiados e arquivos renomeados; horários próximos não provam causa.
  retention: >-
    O que as fontes lidas nesta verificação ainda guardam; a tabela de fontes diz quais não puderam
    ser lidas.
  falsepositives:
    - "Nome compartilhado com software não relacionado, ou arquivo nomeado assim de propósito; ferramenta legítima renomeada"
    - "Arquivos guardados do passado, antes de a conta ou o PC ser usado para jogar"

8771df3a-d8eb-4e26-90d3-ea6fb112ba83:
  title: "Executor/injetor do Roblox detectado por uma família de fontes"
  description: >-
    Uma família de fontes mostra um executor de scripts ou injetor do Roblox, nomeado em contexto
    Roblox, com execução, estrutura de executor, scripts exclusivos de executor ou módulo no player
    do Roblox. Nenhuma segunda família independente o viu. A linha diz qual fonte e classe.
  retention: >-
    O que as fontes lidas nesta verificação ainda guardam; a tabela de fontes diz quais não puderam
    ser lidas.
  falsepositives:
    - "Nome compartilhado com software não relacionado, ou arquivo nomeado assim de propósito; ferramenta legítima renomeada"
    - "Arquivos guardados do passado, antes de a conta ou o PC ser usado para jogar"

7037504d-c285-4c91-99a9-3c11d3dbe8c5:
  title: "Nome de executor/injetor do Roblox visto, sem nada mostrando execução"
  description: >-
    Um arquivo, pasta, atalho, entrada de inventário ou registro do journal tem o nome de um
    executor ou injetor do Roblox em contexto Roblox, e nada nesta verificação mostra que ele rodou
    ou tocou o player. Um nome sozinho é motivo para perguntar, não um achado.
  retention: >-
    O que as fontes lidas nesta verificação ainda guardam; a tabela de fontes diz quais não puderam
    ser lidas.
  falsepositives:
    - "Nome compartilhado com software não relacionado, ou arquivo nomeado assim de propósito; ferramenta legítima renomeada"
    - "Arquivos guardados do passado, antes de a conta ou o PC ser usado para jogar"

d197a1c8-51da-41a7-9728-5daeb2ad622d:
  title: "Launcher, FPS unlocker ou utilitário do Roblox presente ou usado"
  description: >-
    Bloxstrap ou um de seus forks, o FPS unlocker, o Roblox Account Manager ou o mod manager do
    Studio deixou rastros aqui. São usados abertamente por muitos jogadores e não são cheats. A
    linha diz quais fontes o viram e se ele rodou. O que foi alterado com ele está nas linhas de
    FastFlags.
  retention: >-
    O que as fontes lidas ainda guardam.
  falsepositives:
    - "Essas ferramentas são legítimas; a linha é contexto"

04792358-2883-4e4c-92e1-7b7f0a5ff5b7:
  title: "Nome corresponde ao catálogo de ferramentas Roblox sem contexto"
  description: >-
    Um termo genérico (executor, injector, FastFlag, ClientSettings), um nome parcial (strap, trap)
    ou um nome de executor que é palavra comum (Wave, Delta, Solara, Synapse) aparece sem nada que o
    ligue ao Roblox, ou uma ferramenta de FastFlag está presente. Listado para ser olhado, nunca
    pesado sozinho.
  retention: >-
    O que as fontes lidas ainda guardam.
  falsepositives:
    - "Software comum cujo nome contém essas letras, como Razer Synapse ou um editor de áudio"

8c20b430-e3c5-4bfb-b5c6-e1048351066d:
  title: "Fonte histórica aponta arquivo de executor/injetor do Roblox que não está mais no caminho"
  description: >-
    BAM, Amcache, ShimCache, UserAssist ou um atalho registra o caminho de um arquivo com nome de
    executor ou injetor do Roblox, e nada está nesse caminho hoje. Pode ter sido movido, renomeado,
    excluído ou estar em um disco desconectado; isto não diz qual.
  retention: >-
    A retenção de cada fonte histórica; o sistema de arquivos como está na verificação.
  falsepositives:
    - "O arquivo foi movido ou renomeado, ou está em um disco removível não conectado"

7bb54914-266d-4f79-9103-a31a457e1a8d:
  title: "Arquivo com nome de executor/injetor do Roblox foi excluído"
  description: >-
    A Lixeira guarda um item excluído, ou o change journal NTFS guarda um registro de exclusão, de
    um arquivo cujo nome corresponde a um executor ou injetor do Roblox. Excluir arquivos é comum; a
    linha é motivo para perguntar o que era.
  retention: >-
    A Lixeira até ser esvaziada; o change journal até seus registros mais antigos serem
    sobrescritos.
  falsepositives:
    - "Apagar um download que se decidiu não usar"

6bf3e51e-b16d-4d6e-a208-00be42ff698d:
  title: "Horários de rastros de ferramentas Roblox"
  description: >-
    Coloca na linha do tempo cada horário que uma fonte registrou para um rastro de ferramenta
    Roblox visto em contexto Roblox: quando um programa rodou, uma entrada foi escrita, um arquivo
    foi excluído ou um atalho salvo.
  retention: >-
    O que cada fonte ainda guarda.
  falsepositives:
    - "Um horário próximo de outro não mostra causa"

b77bd209-8711-4277-82a9-ae7c6b349a62:
  title: "Arquivo .zip contém a estrutura de pastas de um executor do Roblox"
  description: >-
    Um .zip em Downloads, Área de Trabalho, Temp ou outro local lido tem pastas autoexec e workspace
    lado a lado, a estrutura usada por executores de scripts do Roblox. Só o índice do arquivo foi
    lido; nada foi extraído.
  retention: >-
    O arquivo como está na verificação.
  falsepositives:
    - "Arquivo com scripts para o Roblox Studio ou desenvolvimento de jogo guardados com esses nomes de pasta"

51cd80d4-0a55-4900-9eee-6ad30958c99e:
  title: "Item com nome de executor/injetor do Roblox está na Lixeira"
  description: >-
    A Lixeira desta conta tem um item cujo nome original corresponde a um executor ou injetor do
    Roblox. A linha diz onde ele estava, quando foi excluído e se o conteúdo ainda está na Lixeira.
  retention: >-
    Até a Lixeira ser esvaziada.
  falsepositives:
    - "Download excluído sem uso; arquivo não relacionado com o mesmo nome"

40a072f5-89ee-408d-be3c-41d631978b1e:
  title: "Programa sem assinatura com nome de executor/injetor do Roblox, em contexto Roblox"
  description: >-
    Um programa (.exe ou .dll) cujo nome corresponde a um executor ou injetor do Roblox, num caminho
    que cita o Roblox ou um launcher do Roblox, não tem assinatura embutida que confira aqui.
  retention: >-
    O arquivo como está na verificação.
  falsepositives:
    - "Ferramenta não relacionada sem assinatura que tem o mesmo nome"

b497f8ad-b10f-49fb-8f5f-3f7b41aa09ca:
  title: "Atalho aponta para executor/injetor do Roblox que não está mais no caminho"
  description: >-
    Um atalho na Área de Trabalho, no menu Iniciar, na barra de tarefas ou em Recentes cita um
    executor ou injetor do Roblox, e nada está no destino hoje. O atalho guarda os horários do
    destino de quando foi salvo.
  retention: >-
    Enquanto o arquivo de atalho existir; Recentes apara a própria lista.
  falsepositives:
    - "O programa foi movido ou desinstalado há muito tempo; o destino está em disco desconectado"

b607be39-cc19-418a-b0fb-6dd106db32aa:
  title: "Horários gravados em atalhos para ferramentas Roblox"
  description: >-
    Coloca na linha do tempo os horários do destino que um atalho para ferramenta Roblox gravou, e
    os horários do próprio atalho.
  retention: >-
    Enquanto o arquivo de atalho existir.
  falsepositives:
    - "Os horários do destino são de quando o atalho foi salvo, não de quando o programa rodou"

cdb38cd6-af91-4636-a4b1-95c8aa54800c:
  title: "Inventário de programas do Windows (Amcache) lista programa com nome de executor/injetor do Roblox"
  description: >-
    O Amcache.hve, lido de uma shadow copy existente, tem entrada de inventário para um programa
    cujo nome corresponde a um executor ou injetor do Roblox, com caminho, SHA-1 e o horário em que
    a entrada foi escrita. Entrada de inventário não prova que o programa rodou.
  retention: >-
    O Amcache guarda entradas por meses; uma shadow copy é tão antiga quanto o snapshot.
  falsepositives:
    - "Arquivo inventariado após um download nunca aberto; programa não relacionado com o mesmo nome"

d5560346-9ad6-4b02-ad7b-692097d5bf8a:
  title: "Horários em que o Amcache escreveu entradas de ferramentas Roblox"
  description: >-
    Coloca na linha do tempo quando o inventário de programas do Windows escreveu a entrada de um
    programa cujo nome corresponde ao catálogo de ferramentas Roblox.
  retention: >-
    O Amcache guarda entradas por meses.
  falsepositives:
    - "O horário é de quando a entrada foi escrita, não de execução"

4686e7ad-1ff0-4d42-8ec2-883222bcd7da:
  title: "O change journal registra a exclusão de arquivo com nome de executor/injetor do Roblox"
  description: >-
    O change journal NTFS da unidade do sistema tem um registro de exclusão de arquivo cujo nome
    corresponde a um executor ou injetor do Roblox. O journal cita o arquivo, não a pasta; o mesmo
    nome pode ser de arquivos não relacionados. Programas comuns excluem os próprios temporários.
  retention: >-
    O change journal guarda um número limitado de registros recentes, muitas vezes de dias a
    semanas.
  falsepositives:
    - "Instalador ou atualizador excluindo o próprio arquivo temporário com esse nome"

8ea0ab9d-21dd-4f8a-8bec-08336f5088cb:
  title: "Horários do change journal para arquivos com nome de ferramentas Roblox"
  description: >-
    Coloca na linha do tempo o primeiro e o último registro do change journal de cada nome de
    arquivo que corresponde ao catálogo de ferramentas Roblox.
  retention: >-
    O change journal guarda um número limitado de registros recentes.
  falsepositives:
    - "Um nome não identifica um arquivo"

ef38eab7-9baf-4ce0-9882-1614a4aed672:
  title: "O ClientAppSettings.json lido pelo player do Roblox define FastFlags de rede ou física"
  description: >-
    O arquivo de FastFlags da pasta de versão mais recente com o player define flags cujos nomes
    tratam de física, replicação, pacotes ou envio pela rede. Valores editados dessas flags já foram
    usados para dessincronizar o personagem do servidor. A linha lista os nomes, nunca os valores.
    Clientes recentes do Roblox ignoram flags fora de uma lista de permissões, então uma flag no
    arquivo pode não ter efeito; nada aqui compara o arquivo com uma referência confiável, porque
    não há uma.
  retention: >-
    O arquivo como está na verificação; uma atualização do Roblox cria nova pasta de versão.
  falsepositives:
    - "Flags copiadas de um guia de desempenho sem saber o que fazem"
    - "Flags que um bootstrapper escreveu para uma opção não relacionada cujo nome cita a rede"

b456ead3-43f6-498d-9471-77aa9b576501:
  title: "Launcher ou ferramenta de FastFlags guarda FastFlags de rede ou física"
  description: >-
    O arquivo de configurações de um bootstrapper ou ferramenta de FastFlags define flags cujos
    nomes tratam de física ou envio pela rede. Elas só são aplicadas quando o Roblox é iniciado por
    essa ferramenta; se isso aconteceu é lido no arquivo da pasta de versão e no histórico de
    execução.
  retention: >-
    O arquivo como está na verificação.
  falsepositives:
    - "Configurações guardadas mas nunca usadas para iniciar o Roblox"

884dbc2d-24c2-4564-8bcc-3130ecd302d8:
  title: "O player do Roblox lê um arquivo de FastFlags personalizado"
  description: >-
    A pasta de versão mais recente com o player tem um ClientAppSettings.json que define FastFlags.
    A maioria das flags editadas muda gráficos ou o limite de FPS; a linha as conta por tipo.
  retention: >-
    O arquivo como está na verificação.
  falsepositives:
    - "Bloxstrap e seus forks escrevem este arquivo para as próprias opções de gráficos e FPS"

2eb52c4a-3641-4089-9268-6227fa91fdc0:
  title: "Horários dos arquivos de FastFlags do Roblox"
  description: >-
    Coloca na linha do tempo quando cada arquivo de FastFlags foi criado e escrito pela última vez,
    ao lado das execuções do Roblox e dos rastros de ferramentas.
  retention: >-
    O arquivo como está na verificação.
  falsepositives:
    - "Um launcher reescreve o arquivo a cada início"


